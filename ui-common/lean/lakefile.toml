name = "UiCommon"
version = "0.1.0"
defaultTargets = ["UiCommon"]
moreLeanArgs = ["-M4096", "-j2"]

[[lean_lib]]
name = "UiCommon"
roots = [
  "models.TargetStateModel",
  "models.EasingPiecewiseModel",
  "proofs.TargetStateModelProofs",
  "proofs.EasingPiecewiseModelProofs",
  "theorems.TargetStateModelTheorems",
  "theorems.EasingPiecewiseModelTheorems",
  "proofs.Mutations",
  "JvmSemantics",
  "AxiomAudit",
]

[[lean_lib]]
name = "Jvm"
srcDir = "../../jvm-lean"
roots = ["Jvm", "Jvm.Instr", "Jvm.Semantics", "Jvm.FastExec", "Jvm.Proofs", "Jvm.Tactics", "Jvm.Audit"]
