name = "Navigation"
version = "0.1.0"
defaultTargets = ["Navigation"]
moreLeanArgs = ["-M4096", "-j2"]

[[lean_lib]]
name = "Navigation"
roots = [
  "models.BackstackNavigationModel",
  "proofs.BackstackNavigationModelProofs",
  "theorems.BackstackNavigationModelTheorems",
  "proofs.Mutations",
  "JvmSemantics",
  "AxiomAudit",
