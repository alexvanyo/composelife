name: Setup Lean
description: Sets up elan and Lean 4
inputs:
  toolchain:
    description: 'Lean toolchain to install'
    required: false
    default: 'leanprover/lean4:v4.34.0'
  custom-lean-ref:
    description: 'Git branch or commit SHA of the custom Lean fork'
    required: false
    default: 'av/jvm'
outputs:
  lake-cache-key:
    description: 'Primary key of the Lake cache, for saving it from a job that builds Lean'
    value: ${{ steps.lake-cache.outputs.cache-primary-key }}
  lake-cache-hit:
    description: 'Whether the Lake cache was restored from an exact key match'
    value: ${{ steps.lake-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Cache Elan
      uses: actions/cache@v6
      with:
        path: |
          ~/.elan
        key: elan-${{ runner.os }}-${{ inputs.toolchain }}

    - name: Install Elan & Lean
      shell: bash
      run: |
        if [ ! -x "$HOME/.elan/bin/elan" ]; then
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "${{ inputs.toolchain }}"
        fi
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.elan/bin:$PATH"
        elan default "${{ inputs.toolchain }}"
        lean --version

    - name: Restore Lake packages and build outputs
      id: lake-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          algorithm/lean/.lake
          geometry/lean/.lake
          session-value/lean/.lake
        key: lake-${{ runner.os }}-${{ inputs.toolchain }}-${{ hashFiles('**/lean/lake-manifest.json', '**/lean/lakefile.toml', '**/lean/lean-toolchain') }}
        restore-keys: |
          lake-${{ runner.os }}-${{ inputs.toolchain }}-

    - name: Setup Custom Lean
      uses: ./.github/actions/setup-custom-lean
      with:
        build-if-missing: false
        ref: ${{ inputs.custom-lean-ref }}
