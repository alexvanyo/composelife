name = "Geometry"
version = "0.1.0"
defaultTargets = ["Geometry"]

[[require]]
name = "floatlib"
git = "https://github.com/lean-dojo/FloatLib"
rev = "main"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.0"

[[lean_lib]]
name = "Geometry"
roots = [
  "Geometry",
  "GeometryDefs",
  "GeometryTheorems",
  "GeometryProofs",
  "proofs.Interval",
  "proofs.RayMarchStep",
  "proofs.Soundness",
  "proofs.Completeness",
  "proofs.FloatSemantics",
  "proofs.FloatBounds",
  "proofs.FloatAnalysis",
  "proofs.FloatProperties",
  "proofs.SegmentBound",
  "proofs.SegmentBound.Waypoints",
  "proofs.SegmentBound.PointBound",
  "proofs.SegmentBound.MiniSegment",
  "proofs.SegmentBound.Hausdorff",
]

