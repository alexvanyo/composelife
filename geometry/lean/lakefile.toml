name = "Geometry"
version = "0.1.0"
defaultTargets = ["Geometry"]

[[require]]
name = "floatlib"
git = "https://github.com/lean-dojo/FloatLib"
rev = "main"

[[require]]
name = "aesop"
git = "https://github.com/leanprover-community/aesop"
rev = "master"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.0"

[[lean_lib]]
name = "Geometry"
roots = [
  "Geometry",
  "GeometryDefs",
  "GeometryTheorems",
  "GeometryProofs",
  "models.Basic",
  "models.FloatModel",
  "proofs.Interval",
  "proofs.Continuous",
  "proofs.RayMarchStep",
  "proofs.Soundness",
  "proofs.Completeness",
  "proofs.FloatSemantics",
  "proofs.FloatBounds",
  "proofs.FloatAnalysis",
  "proofs.FloatProperties",
  "proofs.RayMarchLimits",
  "proofs.MiniSegment",
  "proofs.Hausdorff",
  "proofs.NativeFloat",
  "proofs.CompiledRayMarch",
  "proofs.Connectivity",
  "proofs.CompiledPath",
  "proofs.Mutations",
  "AxiomAudit",
]

